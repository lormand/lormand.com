# GitHub Pages cannot be created by this repo's tokens (needs pages=write AND
# administration=write). This workflow retries enablement on each push so that
# if those permissions appear later, the site is published from main at /.
# Until then it logs the one Settings click required and exits successfully.
name: Enable GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  enable-from-branch:
    name: Enable Pages from main /
    runs-on: ubuntu-latest
    steps:
      - name: Create Pages site from branch main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          HDR=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")

          HTTP=$(curl -sS -o /tmp/pages.json -w "%{http_code}" -X POST "${HDR[@]}" \
            "$API" -d '{"build_type":"legacy","source":{"branch":"main","path":"/"}}')
          echo "POST /pages HTTP ${HTTP}"
          cat /tmp/pages.json || true
          echo

          if [[ "$HTTP" == "201" || "$HTTP" == "409" ]]; then
            curl -sS -X PUT "${HDR[@]}" "$API" \
              -d '{"cname":"lormand.com","https_enforced":false,"build_type":"legacy","source":{"branch":"main","path":"/"}}' \
              || true
            curl -sS -X POST "${HDR[@]}" "${API}/builds" || true
            echo "Pages enabled from branch main, path /, custom domain lormand.com."
            exit 0
          fi

          echo "::warning::GitHub Pages is not enabled. Tokens cannot create a Pages site (need pages=write and administration=write)."
          echo "Enable it once in the repo UI, then this site will serve index.html:"
          echo "  https://github.com/${GITHUB_REPOSITORY}/settings/pages"
          echo "  Build and deployment → Source: Deploy from a branch"
          echo "  Branch: main  Folder: / (root)"
          echo "Keep custom domain lormand.com (CNAME file is already in the repo)."
          echo "Site URLs: https://lormand.github.io/lormand.com/  and  https://lormand.com/"
